name: campalert

services:
  app:
    image: davismariotti/campalert:latest
    restart: unless-stopped
    profiles: [app]
    env_file: .env.prod
    environment:
      SPRING_DATA_REDIS_HOST: redis
      # Sized for the 961 MiB / 1 vCPU production droplet: Serial GC avoids G1's concurrent-thread
      # overhead on a single core, metaspace/code-cache/heap are capped explicitly instead of left
      # to MaxRAMPercentage ergonomics (which recomputes if a cgroup memory limit is ever added).
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -XX:MaxMetaspaceSize=192m -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=64m -Xmx192m -Xms64m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - proxy
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.campalert.rule=Host(`campalert-api.davismariotti.com`)"
      - "traefik.http.routers.campalert.entrypoints=web"
      - "traefik.http.routers.campalert.middlewares=campalert-proto"
      - "traefik.http.middlewares.campalert-proto.headers.customRequestHeaders.X-Forwarded-Proto=https"
      - "traefik.http.services.campalert.loadbalancer.server.port=8080"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${SPRING_DATA_REDIS_PASSWORD}
    volumes:
      - ../data/redis:/data
    networks:
      - db

# Schema migrations no longer run through this compose file — see
# `db/migrate` and deploy.sh, which runs the self-contained
# davismariotti/campalert-migrate image directly via `docker run`
# on the `services_backend` network instead of a compose profile.

networks:
  proxy:
    external: true
  db:
    external: true
    name: services_backend
