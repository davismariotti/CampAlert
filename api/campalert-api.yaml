components:
  schemas:
    AuthResponse:
      type: object
      required:
        - id
        - email
        - timezone
        - verificationStatus
        - pushoverOverrideEnabled
        - permissions
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        timezone:
          type: string
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'
        pushoverUserKey:
          type: string
          nullable: true
        pushoverApiToken:
          type: string
          nullable: true
        pushoverOverrideEnabled:
          type: boolean
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    RegisterResponse:
      type: object
      required:
        - verificationStatus
      properties:
        verificationId:
          type: string
          format: uuid
          nullable: true
          description: Absent when verificationStatus is VERIFIED (redeeming an email-tied invite auto-verifies; there is no pending OTP verification to reference).
        verificationStatus:
          $ref: '#/components/schemas/VerificationStatus'

    RegistrationConfigResponse:
      type: object
      required:
        - inviteOnlyEnabled
      properties:
        inviteOnlyEnabled:
          type: boolean

    VerificationStatus:
      type: string
      enum:
        - PENDING_VERIFICATION
        - VERIFIED

    ResendVerificationBody:
      type: object
      required:
        - email
        - turnstileToken
      properties:
        email:
          type: string
        turnstileToken:
          type: string

    VerifyEmailBody:
      type: object
      required:
        - verificationId
        - code
      properties:
        verificationId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^\d{6}$'

    ForgotPasswordBody:
      type: object
      required:
        - email
      properties:
        email:
          type: string

    ResetPasswordBody:
      type: object
      required:
        - resetId
        - token
        - newPassword
      properties:
        resetId:
          type: string
          format: uuid
        token:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
        newPassword:
          type: string
          minLength: 8
          maxLength: 72

    RegisterBody:
      type: object
      required:
        - email
        - password
        - timezone
        - turnstileToken
      properties:
        email:
          type: string
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        password:
          type: string
          minLength: 8
          maxLength: 72
        timezone:
          type: string
        turnstileToken:
          type: string
        inviteId:
          type: string
          format: uuid
          nullable: true
          description: Present together with inviteToken when registering via an invite (email-tied or public link).
        inviteToken:
          type: string
          nullable: true

    LoginBody:
      type: object
      required:
        - email
