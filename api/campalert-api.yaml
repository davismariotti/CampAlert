          nullable: true
          description: Null for public links.
        status:
          $ref: '#/components/schemas/AdminInviteStatus'
        maxUses:
          type: integer
        usedCount:
          type: integer
        createdByEmail:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        deactivatedAt:
          type: string
          format: date-time
          nullable: true

    AdminInviteListResponse:
      type: object
      required:
        - items
        - total
        - page
        - pageSize
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminInviteSummary'
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer

    AdminCreateEmailInvitesBody:
      type: object
      required:
        - emails
      properties:
        emails:
          type: array
          items:
            type: string
            pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          minItems: 1
          maxItems: 50
        expiresInDays:
          type: integer
          minimum: 1
          nullable: true
          description: Defaults to 7 days when omitted.

    AdminEmailInviteResult:
      type: object
      required:
        - email
        - created
      properties:
        email:
          type: string
        created:
          type: boolean
        reason:
          type: string
          nullable: true
          description: Present when created is false, e.g. ALREADY_REGISTERED.

    AdminCreateEmailInvitesResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminEmailInviteResult'

    AdminCreateInviteLinkBody:
      type: object
      required:
        - maxUses
      properties:
        maxUses:
          type: integer
          minimum: 1
        expiresInDays:
          type: integer
          minimum: 1
          nullable: true
          description: Defaults to 7 days when omitted.

    AdminInviteLinkResponse:
      type: object
      required:
        - invite
        - url
      properties:
        invite:
          $ref: '#/components/schemas/AdminInviteSummary'
        url:
          type: string
          description: The one-time shareable registration URL. Not retrievable again after this response.
